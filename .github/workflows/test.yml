name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test geometry and window identity
        run: python3 -m unittest -v test_cockpit.py
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile cockpit.py live_test.py test_cockpit.py
          bash -n install.sh check.sh
      - name: Check manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null
